
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <!-- Connect our CSS file -->
    <link rel="stylesheet" href="styles.css">

    <!-- Connect our JavaScript file -->
    <script src="app.js" defer></script>
</head>

<body>

    <main class="todo-container">

        <header class="todo-header">
            <h1>My To-Do List</h1>
            <p>Organise your day, one task at a time.</p>
        </header>

        <!-- Task input section -->
        <form id="todo-form">
            <input
                type="text"
                id="task-input"
                placeholder="What needs to be done?"
                autocomplete="off"
            >

            <button type="submit" id="add-task-btn">
                Add Task
            </button>
        </form>

        <!-- Task filters -->
        <nav class="filters">
            <button type="button" class="filter-btn active" data-filter="all">
                All
            </button>

            <button type="button" class="filter-btn" data-filter="active">
                Active
            </button>

            <button type="button" class="filter-btn" data-filter="completed">
                Completed
            </button>
        </nav>

        <!-- Tasks will appear here -->
        <ul id="task-list">
        </ul>

        <!-- Task counter and clear button -->
        <footer class="todo-footer">
            <p id="items-left">0 items left</p>

            <button type="button" id="clear-completed">
                Clear Completed
            </button>
        </footer>

    </main>

</body>
</html>
